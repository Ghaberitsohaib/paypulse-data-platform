version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: paypulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paypulse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paypulse_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-paypulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypulse_admin -d paypulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paypulse-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: paypulse-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - paypulse-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: paypulse-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: paypulse-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - paypulse-network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: paypulse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paypulse-network

  spark-master:
    image: bitnami/spark:3.5.1
    container_name: paypulse-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8082:8080"
      - "7077:7077"
    networks:
      - paypulse-network

  spark-worker:
    image: bitnami/spark:3.5.1
    container_name: paypulse-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    networks:
      - paypulse-network

  kestra:
    image: kestra/kestra:v0.17.4
    container_name: paypulse-kestra
    command: server standalone
    ports:
      - "8080:8080"
    environment:
      KESTRA_CONFIGURATION: |
        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/paypulse_db
            driverClassName: org.postgresql.Driver
            username: paypulse_admin
            password: paypulse_secure_pass
    volumes:
      - ./orchestration/flows:/app/flows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - paypulse-network

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: paypulse-dashboard
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=paypulse_db
      - POSTGRES_USER=paypulse_admin
      - POSTGRES_PASSWORD=paypulse_secure_pass
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - paypulse-network

networks:
  paypulse-network:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  minio_data:
